<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6EEDC"/><stop offset="1" stop-color="#E8DCC6"/></linearGradient>
  <clipPath id="clip"><rect x="40" y="40" width="1520" height="920" rx="64"/></clipPath>
</defs>
<!-- soft glow edge -->
<rect x="40" y="40" width="1520" height="920" rx="64" fill="none" stroke="#E9BE5C" stroke-width="26" stroke-opacity="0.85" filter="url(#glow)"/>
<!-- warm light panel -->
<rect x="40" y="40" width="1520" height="920" rx="64" fill="url(#fill)" fill-opacity="0.94"/>
<!-- accent bar -->
<g clip-path="url(#clip)"><rect x="40" y="40" width="1520" height="26" fill="#E4767C"/></g>
<rect x="40" y="40" width="1520" height="920" rx="64" fill="none" stroke="#998C75" stroke-width="4"/>
<!-- divider under the title and namesake line -->
<rect x="100" y="336" width="1020" height="5" rx="2" fill="#BDA88A"/>
<!-- icon / graphic area -->
<circle cx="1345" cy="500" r="204" fill="#E9BE5C" fill-opacity="0.7" filter="url(#halo)"/>
<circle cx="1345" cy="500" r="190" fill="#E4767C"/>
<circle cx="1345" cy="500" r="176" fill="none" stroke="#F6EEDC" stroke-width="5" stroke-opacity="0.8"/>
<g transform="translate(1345 500) scale(1.2)"><path d="M-90,-42 L0,-92 L90,-42 Z" fill="#F6EEDC"/><rect x="-62" y="-30" width="26" height="98" fill="#F6EEDC"/><rect x="-13" y="-30" width="26" height="98" fill="#F6EEDC"/><rect x="36" y="-30" width="26" height="98" fill="#F6EEDC"/><rect x="-92" y="72" width="184" height="18" rx="4" fill="#F6EEDC"/></g>
<!-- MOCK-UP. mainquad: showing fact mainquad.1, the longest, to prove the box fits. placeholder generated by tools/export-art.ts. Dashed boxes are the text regions (px, top-left x,y,w,h): title 100,100,1020,150; namesake 100,258,1020,60; fact 100,372,1020,530. The Lens draws white text with a black outline. -->
<!-- title region -->
<rect x="92" y="94" width="1036" height="162" fill="none" stroke="#998C75" stroke-width="2" stroke-dasharray="12 8"/>
<text x="100" y="100" font-family="sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" stroke="#000000" stroke-width="3.8" paint-order="stroke"><tspan x="100" dy="64">Main Quad</tspan></text>
<!-- namesake region: this card has no namesake, so the line stays empty -->
<rect x="92" y="252" width="1036" height="72" fill="none" stroke="#998C75" stroke-width="2" stroke-dasharray="12 8"/>

<!-- fact region -->
<rect x="92" y="366" width="1036" height="542" fill="none" stroke="#998C75" stroke-width="2" stroke-dasharray="12 8"/>
<text x="100" y="372" font-family="sans-serif" font-size="46" font-weight="normal" fill="#FFFFFF" stroke="#000000" stroke-width="2.8" paint-order="stroke"><tspan x="100" dy="46">Frederick Law Olmsted laid out the campus</tspan><tspan x="100" dy="62.1">plan, and Shepley, Rutan and Coolidge</tspan><tspan x="100" dy="62.1">designed the Quad, which opened with the</tspan><tspan x="100" dy="62.1">university on October 1, 1891.</tspan></text>
</svg>
