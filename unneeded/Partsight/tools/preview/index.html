<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partsight Preview</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#0e1116; --card:#161b22; --ink:#e6edf3; --mute:#8b98a5; --line:#2a313b; --accent:#5aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  .top { padding:20px 24px 8px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .top p { margin:0; color:var(--mute); }
  .status { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; }
  .pill b { color:#3fd17a; }
  .pill.todo b { color:#ffb454; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(440px, 1fr)); gap:16px; padding:16px 24px 32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card h2 { font-size:16px; margin:0; flex:1 1 auto; }
  .badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; background:#2b3a52; color:#9cc4ff; }
  .badge.verified { background:#173d2a; color:#5fe39a; }
  .badge.typical { background:#3d3217; color:#ffd166; }
  .scale { font-size:12px; color:var(--mute); }
  .stage { position:relative; height:300px; margin-top:8px; background:radial-gradient(circle at 50% 40%, #1e2633, #10141a); border-radius:8px; overflow:hidden; }
  .stage canvas { display:block; width:100%; height:300px; }
  .label { position:absolute; transform:translate(-50%, -150%); font-size:11px; white-space:nowrap; background:rgba(10,14,20,.78); border:1px solid #3a4452; padding:1px 6px; border-radius:4px; pointer-events:none; transition:opacity .2s; }
  .label.likely { border-style:dashed; color:#c9d1d9; }
  .controls { display:flex; gap:8px; align-items:center; margin:10px 0 4px; flex-wrap:wrap; }
  .controls input { vertical-align:middle; width:140px; }
  button { background:#21262d; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .summary { color:var(--mute); margin:6px 0; }
  .parts { margin:6px 0 0; padding-left:20px; font-size:12.5px; }
  .parts em { color:#ffd166; font-style:normal; }
  .conf { color:var(--mute); font-size:11px; }
  .fixes { background:#1f1a10; border:1px solid #4a3b17; border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .fixes ul { margin:4px 0 0; padding-left:18px; }
</style>
</head>
<body>
  <div class="top">
    <h1>Partsight: diagram preview</h1>
    <p>Same parts specs and explode math the Lens uses, rendered in the browser. Drag to orbit; use the slider to explode. The grey box is the real object's measured size.</p>
    <div class="status">
      <span class="pill">Unit tests <b>15 / 15 pass</b></span>
      <span class="pill">Lens type-check <b>0 errors</b></span>
      <span class="pill">Verified heroes <b>3</b></span>
      <span class="pill todo">On-device test <b>not run yet</b></span>
    </div>
  </div>
  <div id="grid"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
