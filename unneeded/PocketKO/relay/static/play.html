<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket KO Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  :root { --gold:#ffcc00; --hot:#ff3d7f; --cool:#3de1ff; }
  html,body { margin:0; height:100%; background:#111; overflow:hidden; font-family:Inter, system-ui, sans-serif; color:#fff; }
  .view { position:relative; width:100vw; height:100vh; background:#000 url('/seed.jpg') center/cover no-repeat; }
  .view::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, #0008); pointer-events:none; }
  #stage { position:absolute; inset:0; width:100%; height:100%; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:2; }
  #banner { position:absolute; top:6%; left:50%; transform:translateX(-50%) scale(.9); max-width:80%; text-align:center;
    font-family:Bungee, Impact, sans-serif; font-size:clamp(18px,2.6vw,34px); color:var(--gold); text-shadow:3px 3px 0 #000, 0 0 18px #ff9d00; opacity:0; }
  #banner.show { animation: slam .35s ease-out forwards, fade 3.2s 0.35s forwards; }
  @keyframes slam { from { transform:translateX(-50%) scale(1.6); opacity:0; } to { transform:translateX(-50%) scale(1); opacity:1; } }
  @keyframes fade { 85% { opacity:1; } to { opacity:0; } }
  #card { position:absolute; left:4%; bottom:6%; min-width:240px; padding:12px 16px; border-radius:16px; background:#0009; border:3px solid var(--cool);
    font-size:15px; line-height:1.4; box-shadow:4px 4px 0 #000; }
  #card:empty { display:none; }
  #card b { font-family:Bungee, sans-serif; font-size:20px; color:var(--gold); }
  .spin { display:inline-block; animation: sp 0.8s linear infinite; color:var(--cool); } @keyframes sp { to { transform:rotate(360deg);} }
  #hp { position:absolute; width:180px; height:16px; transform:translate(-50%,-50%); background:#000; border:3px solid #000; border-radius:10px; overflow:hidden; box-shadow:0 0 0 2px #fff; transition:opacity .3s; }
  #hpfill { height:100%; width:100%; transition: width .25s; }
  .pop { position:absolute; transform:translate(-50%,-50%); font-family:Bungee, Impact, sans-serif; font-size:30px; text-shadow:3px 3px 0 #000; animation: up 1.1s ease-out forwards; white-space:nowrap; }
  .pop.big { font-size:56px; animation-duration:1.7s; }
  @keyframes up { 0% { transform:translate(-50%,-50%) scale(.2); opacity:0;} 12% { transform:translate(-50%,-60%) scale(1.4); opacity:1;} 30% { transform:translate(-50%,-80%) scale(1);} 100% { transform:translate(-50%,-220%) scale(.9); opacity:0;} }
  #jumbo { position:absolute; right:3%; top:12%; width:34%; aspect-ratio:16/9; border:8px solid var(--gold); border-radius:16px; background:#000; z-index:3;
    box-shadow:0 0 30px #ff9d0099; display:none; }
  #jumbo.rolling, #jumbo.live { display:block; }
  #jumbo img { width:100%; height:100%; object-fit:cover; border-radius:8px; display:none; }
  #jumbo.live img { display:block; }
  #jumbo .tag { position:absolute; top:-30px; left:0; font-family:Bungee, sans-serif; font-size:15px; color:var(--hot); text-shadow:2px 2px 0 #000; }
  #jumbo .wait { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:Bungee, sans-serif; color:var(--cool); }
  #jumbo.live .wait { display:none; }
  .keys { position:absolute; right:3%; bottom:5%; font-size:12px; color:#ddd; background:#0008; padding:8px 10px; border-radius:10px; z-index:3; }
  .keys kbd { background:#333; border-radius:4px; padding:1px 5px; }
</style>
</head>
<body>
<div class="view">
  <canvas id="stage"></canvas>
  <div id="hud"><div id="banner"></div><div id="card"></div><div id="hp"><div id="hpfill"></div></div></div>
  <div id="jumbo"><div class="tag">LIVE KO CAM · ORBIS</div><div class="wait">ROLLING…</div><img id="ko-img" alt="KO cinematic"></div>
  <div class="keys">Preview of the in-glasses view · <kbd>E</kbd> scan item · <kbd>S</kbd> slam <kbd>A</kbd>/<kbd>D</kbd> swing <kbd>W</kbd> poke <kbd>Q</kbd> toss · <kbd>K</kbd> skip to finisher · <kbd>1</kbd>/<kbd>2</kbd> steer KO · <kbd>R</kbd> rematch</div>
</div>
<script type="module" src="/static/play.js"></script>
</body>
</html>
