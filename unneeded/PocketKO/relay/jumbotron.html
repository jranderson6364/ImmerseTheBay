<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket KO Jumbotron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14082b; --frame:#ffcc00; --ink:#fff; --hot:#ff3d7f; --cool:#3de1ff; --lime:#8cff3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, sans-serif; overflow:hidden; }
  body { background: radial-gradient(circle at 50% 30%, #2d1263, #14082b 70%); }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  .marquee { font-family:Bungee, Impact, sans-serif; font-size:clamp(28px,5vw,64px); letter-spacing:2px; color:var(--frame);
    text-shadow: 0 0 12px #ff9d00, 4px 4px 0 var(--hot); }
  .bulbs { position:absolute; inset:-22px; border-radius:34px; pointer-events:none; border:6px dotted #fff3a0;
    animation: chase 0.6s steps(2) infinite; }
  @keyframes chase { 50% { border-color:#ff9d00; } }
  .screen { position:relative; width:min(92vw, calc((100vh - 220px) * 16 / 9)); aspect-ratio:16/9; border-radius:22px;
    border:10px solid var(--frame); box-shadow: 0 0 40px #ff9d0088, inset 0 0 30px #000; background:#000; }
  .screen img { width:100%; height:100%; object-fit:cover; border-radius:12px; display:block; }
  .attract { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px;
    background: repeating-linear-gradient(45deg, #1b0b3a 0 30px, #22104a 30px 60px); }
  .attract .ko { font-family:Bungee, Impact, sans-serif; font-size:clamp(60px,12vw,170px); color:var(--hot);
    text-shadow: 6px 6px 0 var(--frame), 0 0 30px var(--hot); animation: bounce 1.2s ease-in-out infinite; }
  .attract .sub { font-family:Bungee, sans-serif; font-size:clamp(14px,2vw,26px); color:var(--cool); margin-top:8px; }
  @keyframes bounce { 0%,100% { transform: scale(1) rotate(-3deg);} 50% { transform: scale(1.08) rotate(3deg);} }
  .badge { position:absolute; top:14px; left:14px; font-family:Bungee, sans-serif; font-size:14px; padding:6px 12px; border-radius:999px;
    background:#000a; border:2px solid var(--lime); color:var(--lime); }
  .badge.gen { border-color:var(--hot); color:var(--hot); animation: pulse 0.8s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font-family:Bungee, sans-serif; font-size:15px; padding:10px 16px; border-radius:12px; border:3px solid #000; cursor:pointer;
    background:var(--frame); color:#2b0b55; box-shadow: 4px 4px 0 #000; }
  button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }
  button.alt { background:var(--cool); } button.hot { background:var(--hot); color:#fff; }
  .log { font-size:12px; color:#c9b8ff; opacity:.8; max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="wrap">
  <div class="marquee">POCKET KO</div>
  <div class="screen">
    <div class="bulbs"></div>
    <img id="feed" alt="KO cinematic" style="display:none">
    <div class="attract" id="attract"><div class="ko">K.O.?</div><div class="sub">grab anything. hit the glorp.</div></div>
    <div class="badge" id="badge">WAITING FOR A FIGHT</div>
  </div>
  <div class="bar">
    <button class="hot" id="test">Test KO (banana)</button>
    <button class="alt" data-steer="slow mo">Slow-mo</button>
    <button class="alt" data-steer="explosion">Explode</button>
    <button class="alt" data-steer="zoom out">Zoom out</button>
    <button class="alt" data-steer="again">Again!</button>
    <button id="stop">Stop</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
  const feed = document.getElementById('feed'), attract = document.getElementById('attract'), badge = document.getElementById('badge'), log = document.getElementById('log');
  let ws;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => ws.send(JSON.stringify({type: 'hello', role: 'page'}));
    ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'status') show(m.state, m.detail); };
    ws.onclose = () => setTimeout(connect, 1500);
  }
  function show(state, detail) {
    const live = state === 'generating';
    badge.textContent = live ? 'LIVE · ORBIS KO CAM' : state === 'connecting' || state === 'ready' ? 'WARMING UP THE KO CAM…' : state === 'error' ? 'ERROR' : 'WAITING FOR A FIGHT';
    badge.className = 'badge' + (live ? ' gen' : '');
    if (live) { feed.src = '/stream.mjpg?' + Date.now(); feed.style.display = 'block'; attract.style.display = 'none'; }
    if (state === 'idle') { feed.style.display = 'none'; attract.style.display = 'flex'; }
    log.textContent = `${state}${detail ? ' — ' + detail : ''}`;
  }
  document.getElementById('test').onclick = () => fetch('/test-ko?object=banana', {method: 'POST'});
  document.getElementById('stop').onclick = () => ws && ws.send(JSON.stringify({type: 'stop'}));
  document.querySelectorAll('[data-steer]').forEach(b => b.onclick = () => ws && ws.send(JSON.stringify({type: 'steer', text: b.dataset.steer})));
  connect();
  fetch('/status').then(r => r.json()).then(s => show(s.state, s.detail)).catch(() => {});
</script>
</body>
</html>
